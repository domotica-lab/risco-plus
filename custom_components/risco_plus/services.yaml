set_time:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: risco_plus
    time:
      required: false
      selector:
        datetime:

arm_groups:
  target:
    entity:
      integration: risco_plus
      domain: alarm_control_panel
  fields:
    groups:
      required: true
      example: '["B", "C"]'
      selector:
        select:
          multiple: true
          options:
            - "A"
            - "B"
            - "C"
            - "D"
    code:
      required: false
      selector:
        text:
          type: password
